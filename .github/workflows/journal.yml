name: journal collector

on:
  schedule:
    # Run weekly on Sunday at 23:30 UTC (= 05:00 IST Monday). Weekend
    # has the most closed deals because positions held over the weekend
    # close at any time.
    - cron: '30 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect closed deals from 3Commas
        env:
          THREECOMMAS_API_KEY:    ${{ secrets.THREECOMMAS_API_KEY }}
          THREECOMMAS_API_SECRET: ${{ secrets.THREECOMMAS_API_SECRET }}
        run: |
          python journal.py collect

      - name: Print current journal stats
        if: always()
        run: |
          python journal.py analyze

      - name: Commit updated journal
        if: always()
        run: |
          git config user.name  "renko-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trades_journal.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "journal $(date -u '+%Y-%m-%d %H:%M')Z"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push retry $i"
              sleep 5
            done
          fi
