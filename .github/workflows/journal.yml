name: journal collector

on:
  schedule:
    # Run DAILY at 00:00 UTC (= 05:30 IST). The 3Commas v2 deals
    # endpoint closes its window over each UTC day, so a daily
    # collection is enough to capture every deal by the next morning.
    # M3, 4 Oct 2026 - was weekly Sunday 23:30 UTC, weekly was too
    # sparse once the bot's journal bridge (PART 33.7) started
    # producing rows - a missed weekly run meant a whole week of
    # signal rows with no P/L backfill.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect closed deals from 3Commas
        env:
          THREECOMMAS_API_KEY:    ${{ secrets.THREECOMMAS_API_KEY }}
          THREECOMMAS_API_SECRET: ${{ secrets.THREECOMMAS_API_SECRET }}
        run: |
          python journal.py collect

      - name: Print current journal stats
        if: always()
        run: |
          python journal.py analyze

      - name: Commit updated journal
        if: always()
        run: |
          git config user.name  "renko-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trades_journal.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "journal $(date -u '+%Y-%m-%d %H:%M')Z"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push retry $i"
              sleep 5
            done
          fi
